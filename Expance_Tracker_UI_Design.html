```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* Summary Cards */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .balance {
            color: #4f46e5;
        }

        /* Main Layout */

        .main {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        /* Form */

        .form-box,
        .transactions {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-box h2,
        .transactions h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        /* Transactions */

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            background: #f8fafc;
            border-left: 5px solid #4f46e5;
        }

        .transaction-info h3 {
            margin-bottom: 5px;
        }

        .transaction-info p {
            color: #777;
            font-size: 13px;
        }

        .transaction-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .delete-btn {
            width: auto;
            margin: 0;
            padding: 7px 12px;
            background: #dc2626;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #991b1b;
        }

        .positive {
            color: #16a34a;
            font-weight: bold;
        }

        .negative {
            color: #dc2626;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            color: #777;
        }

        /* Mobile */

        @media (max-width: 800px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .main {
                grid-template-columns: 1fr;
            }

            .transaction {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .transaction-right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>💰 Expense Tracker</h1>
    <p>Manage your income and expenses easily</p>
</header>

<div class="container">

    <!-- Summary -->

    <div class="summary">

        <div class="card">
            <h3>Total Balance</h3>
            <div class="amount balance" id="balance">₹0</div>
        </div>

        <div class="card">
            <h3>Total Income</h3>
            <div class="amount income" id="income">₹0</div>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <div class="amount expense" id="expense">₹0</div>
        </div>

    </div>


    <div class="main">

        <!-- Add Transaction -->

        <div class="form-box">

            <h2>➕ Add Transaction</h2>

            <form id="transactionForm">

                <label>Transaction Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Example: Food"
                    required
                >

                <label>Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="1"
                    required
                >

                <label>Type</label>

                <select id="type">

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>

                <label>Category</label>

                <select id="category">

                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Education</option>
                    <option>Salary</option>
                    <option>Entertainment</option>
                    <option>Other</option>

                </select>

                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </div>


        <!-- Transaction List -->

        <div class="transactions">

            <h2>📋 Recent Transactions</h2>

            <div id="transactionList">

                <div class="empty">
                    No transactions yet.
                </div>

            </div>

        </div>

    </div>

</div>


<footer>
    <p>Expense Tracker © 2026 | HTML CSS JavaScript Project</p>
</footer>


<script>

    let transactions =
        JSON.parse(localStorage.getItem("transactions")) || [];


    const form =
        document.getElementById("transactionForm");

    const transactionList =
        document.getElementById("transactionList");

    const balance =
        document.getElementById("balance");

    const income =
        document.getElementById("income");

    const expense =
        document.getElementById("expense");


    /* Add Transaction */

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value;

        const amount =
            Number(document.getElementById("amount").value);

        const type =
            document.getElementById("type").value;

        const category =
            document.getElementById("category").value;


        const transaction = {

            id: Date.now(),

            name: name,

            amount: amount,

            type: type,

            category: category

        };


        transactions.push(transaction);

        saveData();

        form.reset();

        displayTransactions();

    });


    /* Display Transactions */

    function displayTransactions() {

        transactionList.innerHTML = "";

        if (transactions.length === 0) {

            transactionList.innerHTML =
                '<div class="empty">No transactions yet.</div>';

            updateSummary();

            return;
        }


        transactions.forEach(function(transaction) {

            const div =
                document.createElement("div");

            div.classList.add("transaction");


            const sign =
                transaction.type === "income"
                ? "+"
                : "-";


            const amountClass =
                transaction.type === "income"
                ? "positive"
                : "negative";


            div.innerHTML = `

                <div class="transaction-info">

                    <h3>
                        ${transaction.name}
                    </h3>

                    <p>
                        Category: ${transaction.category}
                    </p>

                </div>

                <div class="transaction-right">

                    <span class="${amountClass}">
                        ${sign} ₹${transaction.amount}
                    </span>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(${transaction.id})">
                        Delete
                    </button>

                </div>

            `;


            transactionList.appendChild(div);

        });


        updateSummary();

    }


    /* Delete Transaction */

    function deleteTransaction(id) {

        transactions =
            transactions.filter(function(transaction) {

                return transaction.id !== id;

            });


        saveData();

        displayTransactions();

    }


    /* Update Summary */

    function updateSummary() {

        let totalIncome = 0;

        let totalExpense = 0;


        transactions.forEach(function(transaction) {

            if (transaction.type === "income") {

                totalIncome += transaction.amount;

            } else {

                totalExpense += transaction.amount;

            }

        });


        const totalBalance =
            totalIncome - totalExpense;


        income.textContent =
            "₹" + totalIncome;

        expense.textContent =
            "₹" + totalExpense;

        balance.textContent =
            "₹" + totalBalance;

    }


    /* Save Data */

    function saveData() {

        localStorage.setItem(
            "transactions",
            JSON.stringify(transactions)
        );

    }


    /* Load Data */

    displayTransactions();

</script>

</body>
</html>
